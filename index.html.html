<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>ASUS Live Price List</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f9;color:#172033}.top{background:#061a40;color:#fff;padding:24px 18px}.wrap{max-width:1100px;margin:auto}.top h1{margin:0 0 6px;font-size:28px}.top p{margin:0;color:#cbd7ec}.tools{display:flex;gap:10px;flex-wrap:wrap;padding:18px 0}.search{flex:1;min-width:260px;padding:14px 16px;border:1px solid #ccd3df;border-radius:10px;font-size:16px}.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;background:#1473e6;color:#fff}.status{padding:0 0 12px;color:#687386}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;padding-bottom:40px}.card{background:#fff;border:1px solid #e0e5ed;border-radius:14px;padding:18px;box-shadow:0 3px 12px #15243b10}.model{font-size:19px;font-weight:800;color:#071a40;margin-bottom:8px}.spec{font-size:13px;line-height:1.45;color:#566074;min-height:58px}.pricebox{margin-top:14px;padding-top:12px;border-top:1px solid #edf0f4}.row{margin:8px 0}.row b{color:#101827}.effective{font-size:18px;color:#0b7a3d}.gst{font-weight:800}.period{background:#f0f6ff;border-radius:8px;padding:9px 10px;margin-top:12px;font-size:14px}.note{font-size:12px;font-weight:700;color:#9a4e00;margin:10px 0 14px}.wa{width:100%;background:#168a49}.error{background:#fff1f1;border:1px solid #f1b8b8;padding:14px;border-radius:10px;color:#8a1f1f}.footer{text-align:center;color:#7a8495;padding:0 0 30px;font-size:12px}@media(max-width:500px){.top h1{font-size:23px}.grid{grid-template-columns:1fr}.card{border-radius:10px}.wrap{padding-left:12px;padding-right:12px}}
</style></head><body>
<header class='top'><div class='wrap'><h1>ASUS Live Price List</h1><p>Latest billing & activation prices</p></div></header>
<main class='wrap'><div class='tools'><input id='q' class='search' placeholder='Search model number or configuration…'><button class='btn' onclick='loadData()'>Refresh</button></div><div id='status' class='status'>Loading latest prices…</div><div id='cards' class='grid'></div></main><div class='footer'>Prices are fetched from the live Google Sheet.</div>
<script>
// Paste the Google Apps Script Web App URL here after deployment.
// Example: https://script.google.com/macros/s/AKfycbxxxxxxxx/exec
const API_URL='https://script.google.com/macros/s/AKfycbxUxrVXkgOMA35Zc4VmI2hSDSbKuKFyLKBCmNriyRM8_bKXHO2mRIGDbIp6J5vMK9iU-w/exec';
let products=[];
function csvParse(s){let rows=[],row=[],v='',q=false;for(let i=0;i<s.length;i++){let c=s[i];if(q){if(c==='"'&&s[i+1]==='"'){v+='"';i++}else if(c==='"')q=false;else v+=c}else{if(c==='"')q=true;else if(c===','){row.push(v);v=''}else if(c==='\n'){row.push(v.replace(/\r$/,''));rows.push(row);row=[];v=''}else v+=c}}if(v||row.length){row.push(v);rows.push(row)}return rows}
function money(v){let n=Number(String(v).replace(/[^0-9.-]/g,''));return Number.isFinite(n)?'₹'+Math.round(n).toLocaleString('en-IN'):v}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function share(p){let text=`*${p.model}*\n${p.spec}\n\n*Billing Price:* ${money(p.billing)} *GST Paid.*\n*Effective Activation Price:* ${money(p.activation)} *GST Paid.*\n\n*Activation Offer Period:* ${p.period}.\n\n_Add bag on this price. This is without bag price._`;window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank')}
function render(){let term=document.getElementById('q').value.trim().toLowerCase();let list=products.filter(p=>(p.model+' '+p.spec).toLowerCase().includes(term));document.getElementById('status').textContent=`${list.length} model${list.length===1?'':'s'} shown • Live Google Sheet`;document.getElementById('cards').innerHTML=list.map((p,i)=>`<article class='card'><div class='model'>${esc(p.model)}</div><div class='spec'>${esc(p.spec)}</div><div class='pricebox'><div class='row'><b>Billing Price:</b> ${money(p.billing)} <span class='gst'>GST Paid.</span></div><div class='row effective'><b>Effective Activation Price:</b> ${money(p.activation)} <span class='gst'>GST Paid.</span></div><div class='period'><b>Activation Offer Period:</b> ${esc(p.period)}</div><div class='note'>Add bag on this price. This is without bag price.</div><button class='btn wa' onclick='share(products[${products.indexOf(p)}])'>Share on WhatsApp</button></div></article>`).join('')||`<div class='error'>No matching model found.</div>`}
async function loadData(){
  let st=document.getElementById('status');
  st.textContent='Fetching latest prices…';
  try{
    if(!API_URL.startsWith('https://script.google.com/macros/s/')){
      throw new Error('Apps Script Web App URL is not added yet.');
    }
    let r=await fetch(API_URL,{cache:'no-store'});
    if(!r.ok) throw new Error('Price API returned '+r.status);
    let data=await r.json();
    if(!data.ok) throw new Error(data.error||'Could not read price data.');
    products=(data.products||[]).map(p=>({
      model:p.model||'',
      spec:p.spec||'',
      billing:p.billing||'',
      activation:p.activation||'',
      period:p.period||''
    })).filter(p=>p.model);
    render();
  }catch(e){
    st.innerHTML=`<div class='error'><b>Could not load the live price list.</b><br>${esc(e.message)}<br><br>Deploy the Google Apps Script as a Web App, copy its <b>/exec</b> URL, and paste it into <b>API_URL</b> in this HTML file.</div>`;
    document.getElementById('cards').innerHTML='';
  }
}
document.getElementById('q').addEventListener('input',render);loadData();
</script></body></html>
